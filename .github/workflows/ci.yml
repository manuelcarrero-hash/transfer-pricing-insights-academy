name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Client secret exposure guard
        run: npm run security:client

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Curriculum integrity
        run: npm run curriculum:check

      - name: Learning path integrity
        run: npm run path:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production bundle secret exposure guard
        run: npm run security:client
