name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Client secret exposure guard
        run: npm run security:client

      - name: Credential infrastructure integrity
        run: npm run credentials:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Curriculum integrity
        run: npm run curriculum:check

      - name: Learning path integrity
        run: npm run path:check

      - name: Frontend polish integrity
        run: npm run polish:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: SEO output integrity
        run: npm run seo:check

      - name: Production bundle secret exposure guard
        run: npm run security:client

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Verify Playwright runtime
        run: npx playwright --version

      - name: Run Academy critical-path E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload P0-A visual review screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0a-visual-review
          path: test-results/p0a-visual/
          if-no-files-found: error
          retention-days: 14

      - name: Upload P0-I final visual audit screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0i-final-visual-audit
          path: test-results/p0i-final-visual/
          if-no-files-found: error
          retention-days: 14
