name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Client secret exposure guard
        run: npm run security:client
      - name: Credential infrastructure integrity
        run: npm run credentials:check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Curriculum integrity
        run: npm run curriculum:check
      - name: Learning path integrity
        run: npm run path:check
      - name: Frontend polish integrity
        run: npm run polish:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: SEO output integrity
        run: npm run seo:check
      - name: Production bundle secret exposure guard
        run: npm run security:client

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Verify Playwright runtime
        run: npx playwright --version
      - name: Run Academy critical-path E2E tests
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload P0-A visual review screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0a-visual-review
          path: test-results/p0a-visual/
          if-no-files-found: error
          retention-days: 14
      - name: Upload P0-I final visual audit screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0i-final-visual-audit
          path: test-results/p0i-final-visual/
          if-no-files-found: error
          retention-days: 14

  practitioner-preview-smoke:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/p1-b1-practitioner-authoritative' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRACTITIONER_PREVIEW_URL: https://feat-p1-b1-practitioner-auth.transfer-pricing-insights-academy.pages.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/smoke-practitioner-preview.mjs

  advanced-practitioner-preview-smoke:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/p1-b2-advanced-practitioner-authoritative' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADVANCED_PREVIEW_URL: https://feat-p1-b2-advanced-practiti.transfer-pricing-insights-academy.pages.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/smoke-advanced-practitioner-preview.mjs

  senior-preview-smoke:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/p1-b3-senior-knowledge-authoritative' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENIOR_PREVIEW_URL: https://feat-p1-b3-senior-knowledge.transfer-pricing-insights-academy.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run authoritative Senior smoke against Cloudflare Preview
        run: node scripts/smoke-senior-preview.mjs

  p1b-global-production-gate:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'qa/p1-b-global-gate' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRACTITIONER_PREVIEW_URL: https://transfer-pricing-insights-academy.pages.dev
      ADVANCED_PREVIEW_URL: https://transfer-pricing-insights-academy.pages.dev
      SENIOR_PREVIEW_URL: https://transfer-pricing-insights-academy.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Junior public verification regression
        run: |
          node - <<'NODE'
          const base='https://transfer-pricing-insights-academy.pages.dev';
          const id='TPIA-JF-20260819-31A3F45BA8A2';
          const r=await fetch(`${base}/api/certificates/${id}`);
          if(!r.ok) throw new Error(`Junior certificate lookup failed: ${r.status}`);
          const j=await r.json();
          if(j.certificateId!==id || j.valid!==true) throw new Error('Junior certificate registry mismatch');
          console.log(`Junior registry PASS ${id}`);
          NODE
      - name: Practitioner authoritative production regression
        run: node scripts/smoke-practitioner-preview.mjs
      - name: Advanced Practitioner authoritative production regression
        run: node scripts/smoke-advanced-practitioner-preview.mjs
      - name: Senior authoritative production regression
        run: node scripts/smoke-senior-preview.mjs
      - name: Existing production credentials remain publicly valid
        run: |
          node - <<'NODE'
          const base='https://transfer-pricing-insights-academy.pages.dev';
          const ids=[
            'TPIA-JF-20260819-31A3F45BA8A2',
            'TPIA-TP-20260820-A9F3E1708908',
            'TPIA-ATP-20260820-932F03CEBFA5',
            'TPIA-SK-20260820-387DAA36AAAC'
          ];
          for (const id of ids) {
            const r=await fetch(`${base}/api/certificates/${id}`);
            if(!r.ok) throw new Error(`${id} registry lookup failed: ${r.status}`);
            const j=await r.json();
            if(j.certificateId!==id || j.valid!==true || j.status!=='valid') throw new Error(`${id} registry mismatch`);
            const page=await fetch(`${base}/verify/${id}`);
            if(!page.ok) throw new Error(`${id} public verify page failed: ${page.status}`);
            console.log(`Public credential PASS ${id}`);
          }
          const missing='TPIA-NOT-A-REAL-CREDENTIAL';
          const missingResp=await fetch(`${base}/api/certificates/${missing}`);
          if(missingResp.status!==404) throw new Error(`Nonexistent certificate expected 404, got ${missingResp.status}`);
          const missingBody=await missingResp.json();
          if(missingBody.valid!==false || missingBody.error!=='certificate_not_found') throw new Error('Invalid certificate rejection payload mismatch');
          console.log('Invalid credential rejection PASS 404 certificate_not_found');
          NODE
