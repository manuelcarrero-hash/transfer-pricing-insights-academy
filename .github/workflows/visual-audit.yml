name: Visual Audit RC1

on:
  push:
    branches:
      - main
    paths:
      - 'tests/e2e/visual-production.spec.ts'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Cloudflare production propagation
        run: sleep 30

      - name: Capture production visual audit
        env:
          VISUAL_AUDIT: '1'
          PLAYWRIGHT_TEST_BASE_URL: 'https://transfer-pricing-insights-academy.pages.dev'
        run: npx playwright test tests/e2e/visual-production.spec.ts --project=chromium

      - name: Upload visual audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: rc1-visual-audit
          path: visual-audit/
          retention-days: 30
